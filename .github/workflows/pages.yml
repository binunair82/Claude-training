name: Deploy to GitHub Pages

# Publishes the whole repository as the Pages site: index.html at the root is
# the landing page, and the Kanban board stays reachable at /VSCODE/.
#
# Pages must already be enabled with its source set to "GitHub Actions"
# (Settings -> Pages). Doing that from here is not possible: GITHUB_TOKEN
# cannot create a Pages site, so configure-pages with enablement:true fails
# with "Resource not accessible by integration".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the repository as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
